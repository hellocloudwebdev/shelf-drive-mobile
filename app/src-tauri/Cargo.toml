[package]
name = "app"
version = "4.5.3"
description = "A local-first file workspace for files stored in Telegram, built with Tauri, Rust, and React."
authors = ["Cameron Amer"]
edition = "2021"
publish = false



[lib]

name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
grammers-client = { git = "https://codeberg.org/Lonami/grammers", rev = "49019a579121c9025c728231bdd9bb9b7113c0b5", features = ["proxy"] }
grammers-session = { git = "https://codeberg.org/Lonami/grammers", rev = "49019a579121c9025c728231bdd9bb9b7113c0b5" }
grammers-mtsender = { git = "https://codeberg.org/Lonami/grammers", rev = "49019a579121c9025c728231bdd9bb9b7113c0b5", features = ["proxy"] }
grammers-tl-types = { git = "https://codeberg.org/Lonami/grammers", rev = "49019a579121c9025c728231bdd9bb9b7113c0b5" }
tokio = { version = "1", features = ["full"] }

tauri-plugin-store = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
chrono = "0.4"
base64 = "0.22"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
log = "0.4"
env_logger = "0.11"
tauri-plugin-updater = "2"
# Default actix-web features include compress-brotli/gzip/zstd; the app never
# registers actix's Compress middleware (its three loopback servers stream
# through custom handlers), so those features only pulled vulnerable transitive
# crates (zstd-safe 7.x / zstd-sys 2.x carry open RUSTSEC advisories with no
# in-range fix) into every target's graph. cookies is required by
# share_routes.rs (share-capability cookies); macros by the routing and test
# attributes; unicode by the router.
actix-web = { version = "4", default-features = false, features = ["macros", "unicode", "cookies"] }
actix-cors = "0.7"
actix-files = "0.6"
actix-multipart = "0.7"
futures = "0.3"
bytes = "1"
async-stream = "0.3"
actix-rt = "2"
tauri-plugin-process = "2"
bitflags = "=2.10.0"
tauri-plugin-deep-link = "2"
tauri-plugin-clipboard-manager = "2"
rand = "0.9"
sha2 = "0.10"
minisign-verify = "0.2.5"
bcrypt = "0.16"
constant_time_eq = "0.3"
uuid = { version = "1", features = ["v4"] }

# Crypto: AEAD, KDF, secret zeroization
chacha20poly1305 = "0.10"
argon2 = "0.5"
hkdf = "0.12"
hmac = "0.12"
zeroize = { version = "1", features = ["derive"] }
getrandom = "0.2"
zip = { version = "=9.0.4", default-features = false, features = ["deflate"] }
sevenz-rust2 = "0.7"
path-clean = "1"
walkdir = "2"
sqlite = { version = "0.37.0", features = ["bundled"] }
mp4parse = "0.17"
urlencoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "socks", "json"] }
tokio-rustls = "0.26"
rustls = "0.23.45"
webpki-roots = "1.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Desktop-only tauri feature set: the tray-icon feature (and the plugins and
# crates below) are compiled exclusively for desktop targets because every
# call site is already #[cfg(not(any(target_os = "android", target_os = "ios")))]
# gated (desktop_tray.rs, lib.rs window-state registration, sync_engine
# watcher.rs). Feature additions here are additive to the common `tauri` dep.
tauri = { version = "2", features = ["tray-icon"] }
unrar = "0.5"
dav-server = { version = "0.11", features = ["actix-compat"] }
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
notify = "7"
notify-debouncer-full = "0.5"

# sysinfo is used only by workspace/device_cache.rs, whose desktop branch is
# gated cfg(not(target_os = "android")) — Android reads free space through the
# JNI File.getUsableSpace() bridge instead. The gate here mirrors that branch.
[target.'cfg(not(target_os = "android"))'.dependencies]
sysinfo = "0.30"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1.1"

# Android ships this crate as a single cdylib; optimize for size over speed
# (media streaming is I/O-bound, not compute-bound) with thin LTO across the
# crate graph. panic = "abort" is deliberately NOT set: the codebase relies on
# unwinding across the FFI boundary (Tauri command handlers and JNI exports
# must unwind into the framework's catch_unwind instead of aborting the
# process), and a cdylib built with panic=abort must abort at its boundary.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true

# Remove once an upstream updater release supports patched zip >= 9.0.4.
[patch.crates-io]
tauri-plugin-updater = { path = "vendor/tauri-plugin-updater" }
