<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="1200" height="130" role="img" aria-labelledby="screens-title screens-desc">
  <title id="screens-title">Screens &amp; Themes</title>
  <desc id="screens-desc">Section banner for Dark &amp; Light UI and 15 Adaptive Themes</desc>

  <defs>
    <!-- Canvas gradient -->
    <linearGradient id="screens-bg" x1="0" y1="0" x2="1200" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#121b2e"/>
    </linearGradient>

    <!-- Frosted glass panel -->
    <linearGradient id="screens-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Accent glow -->
    <radialGradient id="screens-glow" cx="120" cy="65" r="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0"/>
    </radialGradient>

    <!-- Clip for rounded banner -->
    <clipPath id="screens-clip">
      <rect width="1200" height="130" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#screens-clip)">
    <!-- Background -->
    <rect width="1200" height="130" fill="url(#screens-bg)"/>

    <!-- Subtle glow behind icon area -->
    <ellipse cx="100" cy="65" rx="180" ry="100" fill="url(#screens-glow)"/>

    <!-- Frosted glass panel -->
    <rect x="16" y="12" width="1168" height="106" rx="10" fill="url(#screens-glass)" stroke="#C084FC" stroke-opacity="0.20" stroke-width="1"/>

    <!-- Dual Sun/Moon motif (left side) -->
    <g transform="translate(42, 28)">
      <!-- Sun circle -->
      <circle cx="28" cy="36" r="14" fill="#FBBF24" fill-opacity="0.2" stroke="#FBBF24" stroke-width="1.3"/>
      <!-- Sun rays -->
      <line x1="28" y1="16" x2="28" y2="12" stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="28" y1="60" x2="28" y2="56" stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="8" y1="36" x2="4" y2="36" stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="48" y1="36" x2="52" y2="36" stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Moon crescent -->
      <path d="M52 24 A15 15 0 0 0 52 48 A12 12 0 0 1 52 24 Z" fill="#38BDF8" fill-opacity="0.3" stroke="#38BDF8" stroke-width="1.3"/>
    </g>

    <!-- Section number -->
    <text x="140" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="800" fill="#C084FC" opacity="0.30" letter-spacing="-2">03</text>

    <!-- Title -->
    <text x="220" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#e9eef8">Interface &amp; Themes</text>

    <!-- Subtitle -->
    <text x="220" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#e9eef8" opacity="0.55">Dark and Light UI side-by-side · 15 adaptive liquid themes with 4.5:1 contrast floor</text>

    <!-- Right-side decorative accent line -->
    <line x1="1050" y1="35" x2="1150" y2="35" stroke="#C084FC" stroke-opacity="0.18" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="1070" y1="65" x2="1150" y2="65" stroke="#38BDF8" stroke-opacity="0.10" stroke-width="1" stroke-linecap="round"/>
    <line x1="1090" y1="95" x2="1150" y2="95" stroke="#FBBF24" stroke-opacity="0.06" stroke-width="1" stroke-linecap="round"/>

    <!-- Bottom accent bar -->
    <rect x="220" y="118" width="60" height="2" rx="1" fill="#C084FC" opacity="0.40"/>
  </g>
</svg>
