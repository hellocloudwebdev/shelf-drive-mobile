<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="1200" height="24">
  <defs>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4FC3F7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4FC3F7"/>
      <stop offset="1" stop-color="#4FC3F7" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="100" y="11" width="1000" height="2" fill="url(#l)" opacity="0.5"/>
  <circle r="5" cy="12" fill="#FBBF24">
    <animate attributeName="cx" values="100;1100;100" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" keyTimes="0;.5;1"/>
    <animate attributeName="r" values="3;6;3" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" cy="12" fill="#1DE9B6">
    <animate attributeName="cx" values="1100;100;1100" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" keyTimes="0;.5;1"/>
  </circle>
</svg>
