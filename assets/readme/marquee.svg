<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 70" width="1200" height="70">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.12" stop-color="#fff"/>
      <stop offset="0.88" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="m"><rect width="1200" height="70" fill="url(#fade)"/></mask>
    <style>
      .t{font:700 17px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#d7ecfb}
      .chip{fill:#ffffff;fill-opacity:.07;stroke:#4FC3F7;stroke-opacity:.45}
      .row{animation:slide 28s linear infinite}
      @keyframes slide{to{transform:translateX(-1080px)}}
    </style>
  </defs>
  <g mask="url(#m)">
    <g class="row">
      <g id="set">
        <g transform="translate(0 15)"><rect class="chip" width="130" height="40" rx="20"/><text class="t" x="65" y="26" text-anchor="middle">React 19</text></g>
        <g transform="translate(150 15)"><rect class="chip" width="150" height="40" rx="20"/><text class="t" x="75" y="26" text-anchor="middle">TypeScript</text></g>
        <g transform="translate(320 15)"><rect class="chip" width="110" height="40" rx="20"/><text class="t" x="55" y="26" text-anchor="middle">Tauri 2</text></g>
        <g transform="translate(450 15)"><rect class="chip" width="100" height="40" rx="20"/><text class="t" x="50" y="26" text-anchor="middle">Rust</text></g>
        <g transform="translate(570 15)"><rect class="chip" width="120" height="40" rx="20"/><text class="t" x="60" y="26" text-anchor="middle">Tailwind 4</text></g>
        <g transform="translate(710 15)"><rect class="chip" width="130" height="40" rx="20"/><text class="t" x="65" y="26" text-anchor="middle">Grammers</text></g>
        <g transform="translate(860 15)"><rect class="chip" width="110" height="40" rx="20"/><text class="t" x="55" y="26" text-anchor="middle">SQLite</text></g>
        <g transform="translate(990 15)"><rect class="chip" width="70" height="40" rx="20"/><text class="t" x="35" y="26" text-anchor="middle">Vite</text></g>
      </g>
      <use href="#set" x="1080"/>
      <use href="#set" x="2160"/>
    </g>
  </g>
</svg>
