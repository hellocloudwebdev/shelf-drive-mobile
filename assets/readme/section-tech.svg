<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="1200" height="130" role="img" aria-labelledby="tech-title tech-desc">
  <title id="tech-title">Tech Stack &amp; Architecture</title>
  <desc id="tech-desc">Section banner for Tech Stack, System Architecture &amp; Verification</desc>

  <defs>
    <!-- Canvas gradient -->
    <linearGradient id="tech-bg" x1="0" y1="0" x2="1200" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#121b2e"/>
    </linearGradient>

    <!-- Frosted glass panel -->
    <linearGradient id="tech-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Accent glow -->
    <radialGradient id="tech-glow" cx="120" cy="65" r="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>

    <!-- Clip for rounded banner -->
    <clipPath id="tech-clip">
      <rect width="1200" height="130" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tech-clip)">
    <!-- Background -->
    <rect width="1200" height="130" fill="url(#tech-bg)"/>

    <!-- Subtle glow behind icon area -->
    <ellipse cx="100" cy="65" rx="180" ry="100" fill="url(#tech-glow)"/>

    <!-- Frosted glass panel -->
    <rect x="16" y="12" width="1168" height="106" rx="10" fill="url(#tech-glass)" stroke="#34D399" stroke-opacity="0.20" stroke-width="1"/>

    <!-- Architecture layers icon (left side) -->
    <g transform="translate(42, 28)">
      <!-- Top isometric layer -->
      <polygon points="36,16 62,28 36,40 10,28" fill="#34D399" fill-opacity="0.2" stroke="#34D399" stroke-width="1.3"/>
      <!-- Middle isometric layer -->
      <polygon points="36,28 62,40 36,52 10,40" fill="#38BDF8" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1.3"/>
      <!-- Bottom isometric layer -->
      <polygon points="36,40 62,52 36,64 10,52" fill="#DEA584" fill-opacity="0.2" stroke="#DEA584" stroke-width="1.3"/>
    </g>

    <!-- Section number -->
    <text x="140" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="800" fill="#34D399" opacity="0.30" letter-spacing="-2">07</text>

    <!-- Title -->
    <text x="220" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#e9eef8">Tech Stack &amp; Architecture</text>

    <!-- Subtitle -->
    <text x="220" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#e9eef8" opacity="0.55">Tauri 2 · Rust Core · Grammers MTProto · React 19 · SQLite · Zero Relay</text>

    <!-- Right-side decorative accent line -->
    <line x1="1050" y1="35" x2="1150" y2="35" stroke="#34D399" stroke-opacity="0.18" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="1070" y1="65" x2="1150" y2="65" stroke="#38BDF8" stroke-opacity="0.10" stroke-width="1" stroke-linecap="round"/>
    <line x1="1090" y1="95" x2="1150" y2="95" stroke="#DEA584" stroke-opacity="0.06" stroke-width="1" stroke-linecap="round"/>

    <!-- Bottom accent bar -->
    <rect x="220" y="118" width="60" height="2" rx="1" fill="#34D399" opacity="0.40"/>
  </g>
</svg>
