<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="1200" height="130" role="img" aria-labelledby="tour-title tour-desc">
  <title id="tour-title">App Tour</title>
  <desc id="tour-desc">Section banner for App Tour &amp; Walkthrough</desc>

  <defs>
    <!-- Canvas gradient -->
    <linearGradient id="tour-bg" x1="0" y1="0" x2="1200" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#121b2e"/>
    </linearGradient>

    <!-- Frosted glass panel -->
    <linearGradient id="tour-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Accent glow -->
    <radialGradient id="tour-glow" cx="120" cy="65" r="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <!-- Clip for rounded banner -->
    <clipPath id="tour-clip">
      <rect width="1200" height="130" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tour-clip)">
    <!-- Background -->
    <rect width="1200" height="130" fill="url(#tour-bg)"/>

    <!-- Subtle glow behind icon area -->
    <ellipse cx="100" cy="65" rx="180" ry="100" fill="url(#tour-glow)"/>

    <!-- Frosted glass panel -->
    <rect x="16" y="12" width="1168" height="106" rx="10" fill="url(#tour-glass)" stroke="#38BDF8" stroke-opacity="0.18" stroke-width="1"/>

    <!-- Play & Movie reel decorative motif (left side) -->
    <g transform="translate(42, 28)">
      <circle cx="36" cy="36" r="28" fill="none" stroke="#38BDF8" stroke-width="1.4" opacity="0.4"/>
      <circle cx="36" cy="36" r="22" fill="#38BDF8" fill-opacity="0.12" stroke="#38BDF8" stroke-width="1" opacity="0.6"/>
      <!-- Play triangle -->
      <polygon points="32,26 46,36 32,46" fill="#38BDF8" opacity="0.85"/>
      <!-- Progress indicators -->
      <circle cx="6" cy="36" r="2" fill="#38BDF8" opacity="0.3"/>
      <circle cx="66" cy="36" r="2" fill="#38BDF8" opacity="0.3"/>
      <circle cx="36" cy="6" r="2" fill="#38BDF8" opacity="0.3"/>
      <circle cx="36" cy="66" r="2" fill="#38BDF8" opacity="0.3"/>
    </g>

    <!-- Section number -->
    <text x="140" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="800" fill="#38BDF8" opacity="0.30" letter-spacing="-2">01</text>

    <!-- Title -->
    <text x="220" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#e9eef8">App Tour &amp; Walkthrough</text>

    <!-- Subtitle -->
    <text x="220" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#e9eef8" opacity="0.55">Interactive feature video, onboarding steps, and fluid navigation</text>

    <!-- Right-side decorative accent line -->
    <line x1="1050" y1="35" x2="1150" y2="35" stroke="#38BDF8" stroke-opacity="0.18" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="1070" y1="65" x2="1150" y2="65" stroke="#38BDF8" stroke-opacity="0.10" stroke-width="1" stroke-linecap="round"/>
    <line x1="1090" y1="95" x2="1150" y2="95" stroke="#38BDF8" stroke-opacity="0.06" stroke-width="1" stroke-linecap="round"/>

    <!-- Bottom accent bar -->
    <rect x="220" y="118" width="60" height="2" rx="1" fill="#38BDF8" opacity="0.40"/>
  </g>
</svg>
