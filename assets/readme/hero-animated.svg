<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <title>Shelf Drive — More than storage, it's your digital shelf</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d1a"/>
      <stop offset="1" stop-color="#0f1b30"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4FC3F7"/>
      <stop offset="0.5" stop-color="#1DE9B6"/>
      <stop offset="1" stop-color="#FBBF24"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="spread" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#4FC3F7"/>
      <stop offset="0.5" stop-color="#1DE9B6"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.3" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#00BCD4" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#00BCD4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FBBF24" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1" fill="#4FC3F7" opacity="0.18"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="2"/></filter>
    <style>
      .title{font:800 84px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;letter-spacing:-2px}
      .tag{font:500 26px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#b8d4ea}
      .pill{font:600 15px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#cfe8fa}
      .float1{animation:f1 6s ease-in-out infinite}
      .float2{animation:f2 7s ease-in-out infinite}
      .float3{animation:f3 8s ease-in-out infinite}
      @keyframes f1{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
      @keyframes f2{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(14px) rotate(4deg)}}
      @keyframes f3{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
      .rise{opacity:0;animation:rise 1s cubic-bezier(.2,.8,.2,1) forwards}
      @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
      .pulse{animation:pulse 3s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
      @keyframes pulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.15)}}
      .type{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 2.4s .6s ease-out forwards}
      @keyframes draw{to{stroke-dashoffset:0}}
      .reveal{clip-path:inset(0 100% 0 0);animation:reveal 3.2s steps(40,end) 1.2s forwards}
      @keyframes reveal{to{clip-path:inset(0 0 0 0)}}
      .caret{animation:blink 0.9s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .orbit{transform-origin:600px 210px;animation:spin 40s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;clip-path:none!important;stroke-dashoffset:0!important}}
    </style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#dots)"/>
  <ellipse class="pulse" cx="260" cy="170" rx="360" ry="240" fill="url(#g1)"/>
  <ellipse class="pulse" cx="980" cy="300" rx="300" ry="200" fill="url(#g2)" style="animation-delay:1.2s"/>

  <!-- orbit rings -->
  <g class="orbit" fill="none" stroke="#4FC3F7" stroke-opacity="0.14">
    <ellipse cx="600" cy="210" rx="560" ry="150" stroke-dasharray="4 10"/>
    <ellipse cx="600" cy="210" rx="430" ry="110" stroke-dasharray="2 8" transform="rotate(8 600 210)"/>
    <circle cx="1160" cy="210" r="5" fill="#4FC3F7" stroke="none"/>
    <circle cx="40" cy="210" r="4" fill="#FBBF24" stroke="none"/>
  </g>

  <!-- floating file icons -->
  <g class="float1" opacity="0.9">
    <g transform="translate(90 70)">
      <rect width="70" height="86" rx="12" fill="#4FC3F7" fill-opacity="0.14" stroke="#4FC3F7" stroke-opacity="0.7" stroke-width="2"/>
      <path d="M26 30l24 13-24 13z" fill="#c084fc"/>
    </g>
  </g>
  <g class="float2">
    <g transform="translate(1030 60)">
      <rect width="76" height="76" rx="14" fill="#f472b6" fill-opacity="0.12" stroke="#f472b6" stroke-opacity="0.75" stroke-width="2"/>
      <circle cx="26" cy="28" r="7" fill="#f472b6"/>
      <path d="M10 62l20-20 14 12 12-12 10 14v6z" fill="#f472b6" fill-opacity="0.7"/>
    </g>
  </g>
  <g class="float3">
    <g transform="translate(130 290)">
      <path d="M0 14a10 10 0 0 1 10-10h22l10 12h34a10 10 0 0 1 10 10v44a10 10 0 0 1-10 10H10A10 10 0 0 1 0 70z" fill="#FBBF24" fill-opacity="0.14" stroke="#FBBF24" stroke-opacity="0.8" stroke-width="2"/>
    </g>
  </g>
  <g class="float1" style="animation-delay:-2s">
    <g transform="translate(1010 280)">
      <rect width="64" height="80" rx="12" fill="#1DE9B6" fill-opacity="0.12" stroke="#1DE9B6" stroke-opacity="0.75" stroke-width="2"/>
      <path d="M32 24v32m0 0l-12-12m12 12l12-12" stroke="#1DE9B6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- title -->
  <g text-anchor="middle">
    <text class="title rise" x="600" y="200" fill="url(#txt)" style="animation-delay:.1s">Shelf Drive</text>
    <rect class="rise" x="360" y="226" width="480" height="4" rx="2" fill="url(#spread)" style="animation-delay:.5s"/>
    <g clip-path="none">
      <text class="tag reveal" x="600" y="282">More than storage — it’s your digital shelf.</text>
    </g>
  </g>

  <!-- pills -->
  <g class="rise" style="animation-delay:1.6s" text-anchor="middle">
    <g transform="translate(330 320)">
      <rect width="150" height="36" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#4FC3F7" stroke-opacity="0.5"/>
      <circle cx="22" cy="18" r="5" fill="#1DE9B6" class="pulse"/>
      <text class="pill" x="86" y="23">Local-first</text>
    </g>
    <g transform="translate(495 320)">
      <rect width="210" height="36" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#4FC3F7" stroke-opacity="0.5"/>
      <circle cx="22" cy="18" r="5" fill="#4FC3F7" class="pulse" style="animation-delay:.5s"/>
      <text class="pill" x="118" y="23">Powered by Telegram</text>
    </g>
    <g transform="translate(720 320)">
      <rect width="150" height="36" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#4FC3F7" stroke-opacity="0.5"/>
      <circle cx="22" cy="18" r="5" fill="#FBBF24" class="pulse" style="animation-delay:1s"/>
      <text class="pill" x="88" y="23">Open source</text>
    </g>
  </g>
</svg>
