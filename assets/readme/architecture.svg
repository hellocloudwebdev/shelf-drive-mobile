<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="t d">
<title id="t">Shelf Drive Android architecture</title><desc id="d">React and TypeScript run in the Tauri Android shell, which connects through IPC to the Rust core. The core manages local indexing, transfers, streaming and optional TDENC2 encryption, and communicates with Telegram through MTProto.</desc>
