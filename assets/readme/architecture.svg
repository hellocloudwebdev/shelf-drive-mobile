<text x="469" y="174" fill="#16455b" font-family="Segoe UI,sans-serif" font-size="25" font-weight="800">Rust native core</text><text x="469" y="226" fill="#315d70" font-family="Segoe UI,sans-serif" font-size="21" font-weight="700">SQLite · local index</text><text x="469" y="263" fill="#527586" font-family="Segoe UI,sans-serif" font-size="19">Transfers · streaming</text><text x="469" y="300" fill="#527586" font-family="Segoe UI,sans-serif" font-size="19">Optional TDENC2 encryption</text>
<text x="866" y="174" fill="#164b3c" font-family="Segoe UI,sans-serif" font-size="25" font-weight="800">Telegram cloud</text><text x="866" y="226" fill="#315d70" font-family="Segoe UI,sans-serif" font-size="21" font-weight="700">Direct MTProto</text><text x="866" y="263" fill="#527586" font-family="Segoe UI,sans-serif" font-size="19">Saved Messages · files</text><text x="866" y="300" fill="#527586" font-family="Segoe UI,sans-serif" font-size="19">Private channels · folders</text>
