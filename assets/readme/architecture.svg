<rect width="1200" height="410" rx="24" fill="url(#bg)"/><text x="600" y="52" text-anchor="middle" fill="#16394a" font-family="Segoe UI,sans-serif" font-size="27" font-weight="800">From your Android device to your Telegram cloud</text><text x="600" y="82" text-anchor="middle" fill="#66808d" font-family="Segoe UI,sans-serif" font-size="18">A native app shell, a local core and a direct account connection</text>
<g filter="url(#sh)"><rect x="42" y="126" width="322" height="220" rx="20" fill="#e4f5fc" stroke="#b9dfed"/><rect x="439" y="126" width="322" height="220" rx="20" fill="#fff" stroke="#c8e2e9"/><rect x="836" y="126" width="322" height="220" rx="20" fill="#e6f7ef" stroke="#bfe6d3"/></g>
