name: Android Debug APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to build (push your tested changes first)
        type: string
        required: true
        default: main
      target:
        description: Android ABI to build
        type: choice
        required: true
        default: aarch64
        options:
          - aarch64

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build unsigned debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NDK_VERSION: 30.0.14904198
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ''

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust Android target
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-linux-android

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Initialize Android project and apply committed overrides
        working-directory: app
        run: |
          npm run tauri android init
          node scripts/apply-android-overrides.cjs

      - name: Build arm64 debug APK
        working-directory: app
        run: npm run tauri android build -- --target "${{ inputs.target }}" --apk true --debug --ci

      - name: Verify APK exists and calculate SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -path '*/debug/*' -size +0c | sort)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "No non-empty debug APK was produced." >&2
            find app/src-tauri/gen/android/app/build/outputs -maxdepth 6 -type f -print || true
            exit 1
          fi
          mkdir -p android-debug-artifact
          for apk in "${apks[@]}"; do
            cp "$apk" "android-debug-artifact/$(basename "$apk")"
          done
          (cd android-debug-artifact && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh android-debug-artifact
          cat android-debug-artifact/SHA256SUMS.txt

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shelf-drive-android-debug-apk
          path: android-debug-artifact/*
          if-no-files-found: error
          retention-days: 7
