name: Coverage and bundle assurance

on:
  workflow_call:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/quality-assurance.yml'
  push:
    branches: [main, develop]
    paths:
      - 'app/**'
      - '.github/workflows/quality-assurance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-coverage-and-bundles:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
      - name: Install application dependencies
        working-directory: app
        run: npm ci
      - name: Test application with coverage floors
        working-directory: app
        run: npm run test:coverage
      - name: Build and enforce bundle budgets
        working-directory: app
        run: npm run build:verify
      - name: Upload coverage and bundle reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-coverage-and-bundle-reports
          path: |
            app/coverage/
            app/dist/bundle-report.json
          if-no-files-found: error

  rust-coverage:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libdbus-1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: llvm-tools-preview
      - name: Restore reviewed cargo-llvm-cov release
        id: llvm-cov-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-0.8.7-${{ runner.os }}
      - name: Install reviewed cargo-llvm-cov release
        if: steps.llvm-cov-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-llvm-cov --locked --version 0.8.7
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: app/src-tauri
      - name: Collect Rust library coverage
        working-directory: app/src-tauri
        run: |
          mkdir -p coverage
          cargo llvm-cov --lib --lcov --output-path coverage/lcov.info --fail-under-lines 10
          cargo llvm-cov report --html --output-dir coverage/html
      - name: Upload Rust coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-coverage-report
          path: app/src-tauri/coverage/
          if-no-files-found: error

  # Advisory-only lint gate: reports formatting and clippy findings on every
  # app/** pull request without blocking. The same checks are already blocking
  # in release.yml and android-candidate.yml; this job widens the feedback and
  # records the finding count. Promote to blocking once the current findings
  # are triaged.
  rust-lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libdbus-1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: app/src-tauri
      - name: Verify Rust formatting
        id: fmt
        working-directory: app/src-tauri
        shell: bash
        run: |
          set -o pipefail
          cargo fmt --all -- --check 2>&1 | tee fmt-check.txt
      - name: Lint native release targets
        id: clippy
        working-directory: app/src-tauri
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --lib --all-targets -- -D warnings 2>&1 | tee clippy-report.txt
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-lint-reports
          path: |
            app/src-tauri/fmt-check.txt
            app/src-tauri/clippy-report.txt
          if-no-files-found: warn
