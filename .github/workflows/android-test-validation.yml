name: Android TEST emulator validation

on:
  push:
    branches:
      - test-brach
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-test-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-android:
    if: github.ref == 'refs/heads/test-brach'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NDK_VERSION: 30.0.14904198
      ANDROID_TEST_NATIVE_ABIS: x86_64
      RUSTFLAGS: "-C link-arg=-Wl,--allow-multiple-definition"
      CARGO_TARGET_X86_64_LINUX_ANDROID_RUSTFLAGS: "-C link-arg=-Wl,--allow-multiple-definition"
    steps:
      - name: Checkout TEST branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ''

      - name: Install Android SDK, emulator images, and NDK
        shell: bash
        run: |
          sdkmanager \
            'platforms;android-31' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'emulator' \
            'system-images;android-31;google_apis;x86_64' \
            'system-images;android-36;google_apis;x86_64' \
            'system-images;android-36;google-tv;x86_64' \
            "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust x86_64 Android target
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-linux-android

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Initialize Android project and apply TEST overrides
        working-directory: app
        run: |
          npm run tauri android init
          node scripts/apply-android-overrides.cjs

      - name: Build TEST x86_64 debug APK
        working-directory: app
        run: npm run tauri android build -- --target x86_64 --apk true --debug --ci

      - name: Run Android lifecycle harness checks
        working-directory: app
        run: |
          npm test -- --run tests/unit/androidLifecycleHarness.test.ts
          bash scripts/test-foreground-service-lifecycle.sh

      - name: Allow hardware-accelerated Android emulators
        shell: bash
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Run phone instrumentation tests on API 31
        working-directory: app
        env:
          ANDROID_EMULATOR_API: '31'
          ANDROID_EMULATOR_ABI: x86_64
          ANDROID_AVD_HOME: ${{ runner.temp }}/telegram-drive-phone-api31-avd
        run: bash scripts/run-android-emulator-tests.sh phone

      - name: Run phone instrumentation tests on API 36
        working-directory: app
        env:
          ANDROID_EMULATOR_API: '36'
          ANDROID_EMULATOR_ABI: x86_64
          ANDROID_AVD_HOME: ${{ runner.temp }}/telegram-drive-phone-avd
        run: bash scripts/run-android-emulator-tests.sh phone

      - name: Run Google TV instrumentation tests on API 36
        working-directory: app
        env:
          ANDROID_EMULATOR_API: '36'
          ANDROID_EMULATOR_ABI: x86_64
          ANDROID_AVD_HOME: ${{ runner.temp }}/telegram-drive-google-tv-avd
        run: bash scripts/run-android-emulator-tests.sh google-tv

      - name: Upload Android test reports and emulator logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-test-validation-reports
          path: |
            app/src-tauri/gen/android/app/build/reports/androidTests/
            app/src-tauri/gen/android/app/build/outputs/androidTest-results/
            ${{ runner.temp }}/telegram-drive-phone-api31-avd/*.txt
            ${{ runner.temp }}/telegram-drive-phone-api31-avd/*.log
            ${{ runner.temp }}/telegram-drive-phone-avd/*.txt
            ${{ runner.temp }}/telegram-drive-phone-avd/*.log
            ${{ runner.temp }}/telegram-drive-google-tv-avd/*.txt
            ${{ runner.temp }}/telegram-drive-google-tv-avd/*.log
          if-no-files-found: warn
          retention-days: 14
