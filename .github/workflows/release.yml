name: "Release"

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0, v1.0.1

jobs:
  dependency-assurance:
    name: Verify dependency security policy
    uses: ./.github/workflows/dependency-assurance.yml
    permissions:
      contents: read

  verify-release:
    name: Verify release invariants
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libdbus-1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install application dependencies
        working-directory: app
        run: npm ci

      - name: Verify release tag, application version, and changelog
        working-directory: app
        run: npm run release:version:check -- --tag "$GITHUB_REF_NAME" --changelog ../CHANGELOG.md

      - name: Test frontend behavior and architecture invariants
        working-directory: app
        run: npm run test:coverage

      - name: Validate locale resources and generated key types
        working-directory: app
        run: |
          node scripts/i18n/generate-key-types.cjs --check
          npm run i18n:validate

      - name: Build production frontend
        working-directory: app
        run: npm run build:verify

      - name: Test Rust library invariants
        working-directory: app/src-tauri
        run: cargo test --lib

      - name: Verify Rust formatting
        working-directory: app/src-tauri
        run: cargo fmt --all -- --check

      - name: Lint native release targets without warnings
        working-directory: app/src-tauri
        run: cargo clippy --lib --all-targets -- -D warnings

  create-release:
    needs: [verify-release, dependency-assurance]
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      
      - name: Extract changelog for this version
        id: changelog
        run: |
          # Extract the first version block from CHANGELOG.md (between first and second ## headings)
          BODY=$(awk '/^## \[/{if(found) exit; found=1; next} found' CHANGELOG.md)
          # Escape for GitHub Actions output
          echo "BODY<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create-release
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RELEASE_BODY: ${{ steps.changelog.outputs.BODY }}
          RELEASE_VERSION: ${{ steps.get_version.outputs.VERSION }}
        with:
          script: |
            const tag = `v${process.env.RELEASE_VERSION}`;
            // Draft releases are invisible to getReleaseByTag, so match the tag
            // across all releases (including drafts) and keep exactly one.
            const allReleases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            const matching = allReleases.filter(release => release.tag_name === tag);
            let releaseId;
            if (matching.length > 0) {
              releaseId = matching[0].id;
              for (const stale of matching.slice(1)) {
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: stale.id
                });
                console.log(`Deleted duplicate release ${stale.id} for tag ${tag}`);
              }
              // Remove assets from a previous attempt so the draft cannot
              // accumulate stale or partially renamed artifacts.
              const staleAssets = await github.paginate(github.rest.repos.listReleaseAssets, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: releaseId
              });
              for (const asset of staleAssets) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id
                });
              }
              console.log(`Cleared ${staleAssets.length} stale assets from release ${releaseId}`);
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: releaseId,
                tag_name: tag,
                body: process.env.RELEASE_BODY,
                draft: true
              });
              console.log(`Reset existing release for tag ${tag} (ID: ${releaseId})`);
            } else {
              const { data: newRelease } = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: `Shelf Drive v${process.env.RELEASE_VERSION}`,
                body: process.env.RELEASE_BODY,
                draft: true,
                prerelease: false
              });
              console.log(`Created new release for tag ${tag} (ID: ${newRelease.id})`);
              releaseId = newRelease.id;
            }
            return releaseId;

  build-android:
    name: Build and sign Android release
    needs: create-release
    uses: ./.github/workflows/android.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    secrets: inherit

  collect-android:
    name: Verify and attach Android artifacts
    needs: [create-release, build-android]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download the signed Android artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: telegram-drive-android-signed
          path: android-release

      - name: Validate required Android artifacts
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test -f "android-release/ShelfDrive_${version}.apk"
          test -f "android-release/ShelfDrive_${version}.aab"
          test -s "android-release/android-update.json"
          test -s "android-release/android-update.json.sig"
          test -f "android-release/SHA256SUMS.txt"
          jq -e --arg version "$version" \
            '.packageName == "com.hellocloudweb.shelfdrive"
              and .version == $version
              and .filename == "ShelfDrive_\($version).apk"' \
            android-release/android-update.json > /dev/null
          (cd android-release && sha256sum -c SHA256SUMS.txt)

      - name: Upload the Android artifacts to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            android-release/*

  release-assurance:
    needs: [create-release, collect-android]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Generate locked source SBOM
        run: node scripts/generate-sboms.cjs release-assurance

      - name: Download the final draft release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          gh release download "$GITHUB_REF_NAME" --dir release-assets --clobber
          rm -f release-assets/SHA256SUMS.txt release-assets/shelf-drive-source-sbom.cdx.json release-assets/provenance.sigstore.json release-assets/sbom-attestation.sigstore.json
          version="${GITHUB_REF_NAME#v}"
          cp release-assurance/shelf-drive-source-sbom.cdx.json release-assets/
          node scripts/generate-checksums.cjs release-assets release-assurance/SUBJECTS.sha256

      - name: Attest release provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: release-assurance/SUBJECTS.sha256

      - name: Attest release SBOM
        id: sbom-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: release-assurance/SUBJECTS.sha256
          sbom-path: release-assurance/shelf-drive-source-sbom.cdx.json

      - name: Verify and upload release assurance artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom-attestation.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE_BUNDLE" release-assets/provenance.sigstore.json
          cp "$SBOM_BUNDLE" release-assets/sbom-attestation.sigstore.json
          node scripts/generate-checksums.cjs release-assets release-assets/SHA256SUMS.txt
          (cd release-assets && sha256sum -c SHA256SUMS.txt)
          gh release upload "$GITHUB_REF_NAME" \
            release-assets/shelf-drive-source-sbom.cdx.json \
            release-assets/provenance.sigstore.json \
            release-assets/sbom-attestation.sigstore.json \
            release-assets/SHA256SUMS.txt \
            --clobber

  publish-release:
    needs: [create-release, release-assurance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish Release
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.release_id,
              draft: false,
              prerelease: false,
              make_latest: 'true'
            })
