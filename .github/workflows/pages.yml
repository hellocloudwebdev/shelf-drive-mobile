name: Deploy landing site

# Publishes website/ to GitHub Pages. The site is plain HTML, CSS and JS with
# pre-generated WebP assets, so there is no build step: the folder is uploaded
# as-is. Regenerate the images with scripts/generate_website_assets.py before
# committing if screenshots change.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'screenshots/live/**'
      - 'scripts/generate_website_assets.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
